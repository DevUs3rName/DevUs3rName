<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" type="image/png" href="../favicon.ico" />
    <title>420username • Projects</title>
    <link rel="stylesheet" href="../style.css" />
    <style>
        .projects-section {
            position: relative;
            z-index: 10;
            padding: 120px 20px 80px 20px;
            max-width: 1100px;
            margin: 0 auto;
            width: 92%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .projects-title {
            font-size: 14px;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: #777;
            margin-bottom: 30px;
            text-align: center;
        }
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .project-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 16px 18px 18px 18px;
            border: 1px solid #262626;
            border-radius: 16px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            text-decoration: none;
            color: #f4f4f4;
            cursor: pointer;
            gap: 12px;
            overflow: hidden;
        }
        .project-card:hover {
            border-color: #555;
            background: rgba(20,20,20,0.7);
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        .project-image {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 10px;
            overflow: hidden;
            background: #111;
            flex-shrink: 0;
        }
        .project-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }
        .project-card:hover .project-image img {
            transform: scale(1.03);
        }
        .project-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            width: 100%;
        }
        .project-name {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -.02em;
        }
        .project-desc {
            font-size: 12px;
            color: #888;
            text-align: left;
        }
        .project-tag {
            font-size: 10px;
            padding: 4px 12px;
            border: 1px solid #333;
            border-radius: 999px;
            color: #aaa;
            transition: 0.2s;
            display: inline-block;
            margin-top: 2px;
        }
        .project-card:hover .project-tag {
            border-color: #666;
            color: #fff;
        }

        @media (max-width: 800px) {
            .projects-section { padding: 100px 10px 60px 10px; }
            .projects-grid { grid-template-columns: 1fr; gap: 16px; }
            .project-card { flex-direction: row; align-items: center; padding: 12px 16px; gap: 14px; }
            .project-image { width: 120px; aspect-ratio: 16 / 10; flex-shrink: 0; }
            .project-name { font-size: 15px; }
            .project-desc { font-size: 11px; }
        }
        @media (max-width: 600px) {
            .projects-title { font-size: 12px; margin-bottom: 16px; }
            .projects-grid { gap: 12px; }
            .project-card { flex-direction: column; align-items: flex-start; padding: 12px 14px; gap: 10px; border-radius: 12px; }
            .project-image { width: 100%; aspect-ratio: 16 / 9; }
            .project-name { font-size: 14px; }
            .project-desc { font-size: 10px; }
            .project-tag { font-size: 8px; padding: 2px 10px; }
        }
        @media (max-width: 400px) {
            .project-card { padding: 10px 12px; gap: 8px; }
            .project-name { font-size: 13px; }
            .project-desc { font-size: 9px; }
            .project-tag { font-size: 7px; padding: 2px 8px; }
        }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="page visible">
        <div class="player-wrapper">
            <div class="player" id="player">
                <button class="player-btn" id="musicBtn">
                    <svg class="play-icon" viewBox="0 0 24 24">
                        <polygon points="5,3 19,12 5,21" />
                    </svg>
                    <svg class="pause-icon" viewBox="0 0 24 24">
                        <rect x="6" y="4" width="4" height="16" />
                        <rect x="14" y="4" width="4" height="16" />
                    </svg>
                </button>
                
                <div class="player-info">
                    <div class="player-track">
                        <span class="track-name">Dead Fresh</span>
                        <span class="track-artist">Lil Baby</span>
                    </div>
                    <div class="player-progress">
                        <div class="progress-bar" id="progressBar">
                            <div class="progress-fill" id="progressFill">
                                <div class="progress-dot"></div>
                            </div>
                        </div>
                        <div class="player-time">
                            <span id="currentTime">0:00</span>
                            <span id="totalTime">0:00</span>
                        </div>
                    </div>
                </div>

                <div class="player-controls">
                    <button class="volume-toggle" id="volumeBtn">
                        <svg viewBox="0 0 24 24">
                            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                        </svg>
                    </button>
                    <div class="volume-slider-wrap">
                        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.15">
                    </div>
                </div>
            </div>
        </div>

        <div class="projects-btn-wrapper">
            <a href="../index.html" class="projects-btn" id="backLink">← back to home</a>
        </div>

        <section class="projects-section">
            <div class="projects-title">✦ projects</div>
            <div class="projects-grid">
                <a href="#" class="project-card">
                    <div class="project-image">
                        <img src="./project1.jpg" alt="" />
                    </div>
                    <div class="project-info">
                        <span class="project-name"></span>
                        <span class="project-desc"></span>
                    </div>
                    <span class="project-tag"></span>
                </a>
                <a href="#" class="project-card">
                    <div class="project-image">
                        <img src="./project2.jpg" alt="" />
                    </div>
                    <div class="project-info"> 
                        <span class="project-name"></span>
                        <span class="project-desc"></span>
                    </div>
                    <span class="project-tag"></span>
                </a>
                <a href="#" class="project-card">
                    <div class="project-image">
                        <img src="./project3.jpg" alt="" />
                    </div>
                    <div class="project-info">
                        <span class="project-name"></span>
                        <span class="project-desc"></span>
                    </div>
                    <span class="project-tag"></span>
                </a>
                <a href="#" class="project-card">
                    <div class="project-image">
                        <img src="./project4.jpg" alt="" />
                    </div>
                    <div class="project-info">
                        <span class="project-name"></span>
                        <span class="project-desc"></span>
                    </div>
                    <span class="project-tag"></span>
                </a>
            </div>
        </section>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        let music = document.getElementById('music');
        if (!music) {
            music = document.createElement('audio');
            music.id = 'music';
            music.loop = true;
            music.preload = 'auto';
            const source = document.createElement('source');
            source.src = '../music.mp3';
            source.type = 'audio/mpeg';
            music.appendChild(source);
            document.body.prepend(music);
        }

        const savedTime = parseFloat(localStorage.getItem('musicCurrentTime')) || 0;
        const savedPlaying = localStorage.getItem('musicPlaying') === 'true';
        const savedVolume = parseFloat(localStorage.getItem('musicVolume')) || 0.15;

        music.currentTime = savedTime;
        music.volume = savedVolume;
        const musicBtn = document.getElementById('musicBtn');
        const progressFill = document.getElementById('progressFill');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const volumeBtn = document.getElementById('volumeBtn');
        const volumeSlider = document.getElementById('volumeSlider');

        let progressInterval = null;

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        function updateProgress() {
            if (music.duration) {
                const percent = (music.currentTime / music.duration) * 100;
                progressFill.style.width = percent + '%';
                currentTimeEl.textContent = formatTime(music.currentTime);
                totalTimeEl.textContent = formatTime(music.duration);
            }
        }

        function toggleMusic() {
            if (music.paused) {
                music.play().then(() => {
                    musicBtn.classList.add('playing');
                    startProgress();
                }).catch(() => {});
            } else {
                music.pause();
                musicBtn.classList.remove('playing');
                clearInterval(progressInterval);
            }
        }

        function startProgress() {
            clearInterval(progressInterval);
            progressInterval = setInterval(updateProgress, 200);
        }

        music.volume = savedVolume;
        volumeSlider.value = savedVolume;

        if (savedPlaying) {
            music.play().catch(() => {});
            musicBtn.classList.add('playing');
            startProgress();
        }
        musicBtn.addEventListener('click', toggleMusic);

        music.addEventListener('timeupdate', updateProgress);
        music.addEventListener('loadedmetadata', function() {
            totalTimeEl.textContent = formatTime(music.duration);
        });

        progressBar.addEventListener('click', function(e) {
            const rect = this.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            if (music.duration) {
                music.currentTime = percent * music.duration;
                updateProgress();
            }
        });

        volumeSlider.addEventListener('input', function() {
            music.volume = parseFloat(this.value);
            if (this.value == 0) {
                volumeBtn.classList.add('muted');
            } else {
                volumeBtn.classList.remove('muted');
            }
        });

        volumeBtn.addEventListener('click', function() {
            if (music.volume > 0) {
                music.volume = 0;
                volumeSlider.value = 0;
                this.classList.add('muted');
            } else {
                music.volume = 0.15;
                volumeSlider.value = 0.15;
                this.classList.remove('muted');
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === ' ' && !e.target.matches('input, textarea, button')) {
                e.preventDefault();
                toggleMusic();
            }
        });
        particlesJS('particles-js', {
            particles: {
                number: { value: 80, density: { enable: true, value_area: 700 } },
                color: { value: '#aaaaaa' },
                shape: { type: 'circle', stroke: { width: 0, color: '#000000' } },
                opacity: { value: 0.5, random: true, anim: { enable: true, speed: 1.0, opacity_min: 0.2, sync: false } },
                size: { value: 4, random: true, anim: { enable: true, speed: 3, size_min: 2, sync: false } },
                line_linked: { enable: true, distance: 180, color: '#888888', opacity: 0.4, width: 1.0 },
                move: { enable: true, speed: 1.0, direction: 'none', random: true, straight: false, out_mode: 'out', bounce: false, attract: { enable: false, rotateX: 600, rotateY: 1200 } }
            },
            interactivity: {
                detect_on: 'canvas',
                events: { onhover: { enable: true, mode: 'repulse' }, onclick: { enable: true, mode: 'push' }, resize: true },
                modes: { repulse: { distance: 150, duration: 0.4 }, push: { particles_nb: 6 } }
            },
            retina_detect: true
        });
        document.getElementById('backLink').addEventListener('click', function(e) {
            localStorage.setItem('musicCurrentTime', music.currentTime);
            localStorage.setItem('musicPlaying', !music.paused ? 'true' : 'false');
            localStorage.setItem('musicVolume', music.volume);
            sessionStorage.setItem('returningFromProjects', 'true');
        });

        window.addEventListener('beforeunload', function() {
            localStorage.setItem('musicCurrentTime', music.currentTime);
            localStorage.setItem('musicPlaying', !music.paused ? 'true' : 'false');
            localStorage.setItem('musicVolume', music.volume);
        });
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey || e.metaKey) {
                const blockedKeys = ['c', 'v', 'x', 'a', 's', 'u', 'p', 'i', 'j'];
                if (blockedKeys.includes(e.key.toLowerCase())) { e.preventDefault(); return false; }
            }
            if (e.key === 'F12' || e.key === 'PrintScreen') { e.preventDefault(); return false; }
        });
        document.addEventListener('selectstart', function(e) { e.preventDefault(); return false; });
        document.addEventListener('copy', function(e) { e.preventDefault(); return false; });
        document.addEventListener('cut', function(e) { e.preventDefault(); return false; });
        document.addEventListener('paste', function(e) { e.preventDefault(); return false; });

        let devtoolsOpen = false;
        const threshold = 160;
        setInterval(function() {
            const widthThreshold = window.outerWidth - window.innerWidth > threshold;
            const heightThreshold = window.outerHeight - window.innerHeight > threshold;
            if (widthThreshold || heightThreshold) {
                if (!devtoolsOpen) {
                    devtoolsOpen = true;
                    console.clear();
                    console.log('%c🛑 Zabezpieczenie! DevTools wykryte!', 'color: red; font-size: 20px; font-weight: bold;');
                }
            } else {
                devtoolsOpen = false;
            }
        }, 1000);
    </script>
</body>
</html>
